name: Update metric cards layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-metrics-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_metrics_layout.py
      - name: Commit layout update
        run: |
          git config user.name "OpenAI Portfolio Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Improve hero metric cards layout [skip ci]"
          git push origin HEAD:main
