name: One-time portfolio metadata update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-metadata-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply metadata corrections
        run: python .github/scripts/update_portfolio.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "OpenAI Portfolio Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update CNEG, BNDES and journal publication statuses [skip ci]"
          git push origin HEAD:main
