name: Update researcher positioning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-researcher-title.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update header wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Research Portfolio • Independent Researcher', 'Research Portfolio • AI, Reliability & Railway Systems Researcher', 1)
          s = s.replace('Electrical Engineer and independent researcher focused on reliable AI, railway asset intelligence, decision support, maintenance engineering, and critical infrastructure.', 'Electrical Engineer and researcher focused on reliable AI, railway asset intelligence, decision support, maintenance engineering, and critical infrastructure.', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-researcher-title.yml
          git config user.name "OpenAI Portfolio Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/update-researcher-title.yml
          git commit -m "Refine researcher positioning [skip ci]"
          git push origin HEAD:main