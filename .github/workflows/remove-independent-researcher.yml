name: Normalize researcher title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-independent-researcher.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining independent researcher labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('I am an Electrical Engineer and independent researcher with a professional trajectory in industrial railway maintenance, reliability, operations, and asset management.', 'I am an Electrical Engineer and researcher with a professional trajectory in industrial railway maintenance, reliability, operations, and asset management.')
          s = s.replace('Independent Researcher • Electrical Engineer • Brazil', 'AI, Reliability & Railway Systems Researcher • Electrical Engineer • Brazil')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/remove-independent-researcher.yml
          git config user.name "OpenAI Portfolio Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/remove-independent-researcher.yml
          git commit -m "Remove remaining independent researcher references [skip ci]"
          git push origin HEAD:main
